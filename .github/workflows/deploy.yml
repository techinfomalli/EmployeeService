name: Build and Deploy to Local Rancher

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted  # <--- ఇది మీ లోకల్ రన్నర్‌ని పిలుస్తుంది
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build with Maven
      run: mvn clean package -DskipTests

    - name: Build Docker Image
      run: |
        docker build -t my-employee-service:latest .

    - name: Deploy to Kubernetes
      run: |
        kubectl apply -f employee-dep.yaml
        kubectl rollout restart deployment employee-service